disableKinds = ['category'] # Categories disabled initially

[params]
  relatedBlogsLength = 3
  description = "FivexL blog and case studies - Expert AWS insights, DevOps best practices, cloud engineering guidance, and real-world success stories"
  # Downloadable resources (/resources/). The Brevo form, R2 bucket and signing key
  # are configured on the Worker (wrangler.toml, src/resources.js).
  [params.resources]
    # Cloudflare Turnstile site key: the same widget as the captcha in the Brevo form settings.
    turnstile_sitekey = "0x4AAAAAAABbGaideoQ1O15c"
  [params.author]
    name = "FivexL"
    email = "info@fivexl.io"
  [params.banner]
    enabled = true
    label = "Live webinar"
    date = "November 11"
    name = "Amazon Bedrock AgentCore: run an AI agent proof-of-concept without touching your product"
    # Optional shorter name for phones
    name_short = "Amazon Bedrock AgentCore"
    cta = "Register"
    url = "/webinars/aws-agentcore/"

[imaging]
  quality = 80

[outputs]
  home = ['HTML', 'RSS']
  section = ['HTML', 'JSON', 'RSS']

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
