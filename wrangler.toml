name = "website"
compatibility_date = "2026-06-05"
main = "src/worker.js"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Email-gated PDFs for /resources/ (see src/resources.js). The bucket is private:
# files are only served through short-lived signed links, handed out after the Brevo form accepts an email.
[[r2_buckets]]
binding = "RESOURCES_BUCKET"
bucket_name = "resources"

# Secret, set in the dashboard under Runtime variables and secrets: DOWNLOAD_SIGNING_KEY.

# Contact form -> Attio (see src/contact.js). Secrets, set in the dashboard under Runtime variables
# and secrets: ATTIO_API_KEY and TURNSTILE_SECRET_KEY.
[vars]
# Slug of the Attio list new contacts are added to (Attio > the list > settings). Empty: no list.
ATTIO_LIST = "inbound"
# Newsletter sign-up -> Brevo and Attio (see src/subscribe.js). Secret: BREVO_API_KEY.
# ID of the Brevo newsletter list (Brevo > Contacts > Lists).
BREVO_NEWSLETTER_LIST = "2"
# Webinar registrations and recording requests -> Brevo and Attio (see src/webinar.js).
# ID of the shared Brevo webinar list. Empty: webinar contacts only go to Brevo through the newsletter box.
BREVO_WEBINAR_LIST = "15"

# Workers Logs: keeps console output (e.g. Attio errors from the contact form) and shows it under
# Workers & Pages > website > Logs. Invocation logs (one entry per request, with the visitor's IP,
# location and headers) are off: we only need our own error lines. Matches the dashboard settings.
[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = false
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = false
