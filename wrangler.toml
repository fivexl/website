name = "website"
compatibility_date = "2026-06-05"
main = "src/worker.js"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Email-gated PDFs for /resources/ (see src/resources.js). The bucket is private:
# files are only served through short-lived signed links, handed out after the Brevo form accepts an email.
[[r2_buckets]]
binding = "RESOURCES_BUCKET"
bucket_name = "resources"

# Secret, set in the dashboard under Runtime variables and secrets: DOWNLOAD_SIGNING_KEY.
